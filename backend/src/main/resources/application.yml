spring:
  application:
    name: mall-backend

  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # 文件上传大小限制（与 mall.minio.max-size-bytes 保持一致）
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

server:
  port: 8080

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh-CN

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mall.**.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

mall:
  # JWT：仓库内只放开发用密钥，生产用 application-local.yml / 环境变量覆盖
  jwt:
    secret: mall-dev-secret-key-change-in-production-at-least-256-bits
    expiration: 86400000
  # 短信验证码登录
  sms:
    # 未接入真实短信服务商：mock 模式下发送接口回显验证码，方便本地联调；生产必须置为 false
    mock-enabled: true
    code-length: 6
    # 验证码有效期（秒）
    code-ttl-seconds: 60
    # 同一手机号两次发送的最小间隔（秒）
    send-interval-seconds: 60
    # 同一验证码最大校验失败次数，超过即作废
    max-verify-fails: 5
  # 对象存储（图片上传）
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:mall}
    # 对外访问前缀，为空时使用 endpoint
    public-url: ${MINIO_PUBLIC_URL:}
    # 单文件大小上限（字节），默认 5MB
    max-size-bytes: 5242880

