spring:
  application:
    name: mall-backend

  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # 文件上传大小限制（与 mall.minio.max-size-bytes 保持一致）
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 20MB

  # Spring AI：默认关闭全部模型自动装配。
  # 未配置 api-key 时，spring-ai-starter-model-openai 仍会尝试创建 chat/embedding/image/audio-speech/
  # audio-transcription/moderation 六个 Bean 并在启动期抛「OpenAI API key must be set」，
  # 因此必须显式置 none；不再使用时（如仅用 chat）也一并关闭其余，避免无谓 Bean 与启动失败。
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      api-key: ${MALL_AI_API_KEY:}
      chat:
        base-url: ${MALL_AI_BASE_URL:https://api.deepseek.com/v1}
        options:
          model: ${MALL_AI_MODEL:deepseek-chat}
      embedding:
        base-url: ${MALL_AI_EMBEDDING_BASE_URL:}
        api-key: ${MALL_AI_EMBEDDING_API_KEY:}
        options:
          model: ${MALL_AI_EMBEDDING_MODEL:}

server:
  port: 8080

# API 文档（官方 springdoc；原 Knife4j 与 Boot 3.4 不兼容已移除）
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.mall.**.entity
  global-config:
    db-config:
      id-type: ASSIGN_ID
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

mall:
  # JWT：仓库内只放开发用密钥，生产用 application-local.yml / 环境变量覆盖
  jwt:
    secret: mall-dev-secret-key-change-in-production-at-least-256-bits
    expiration: 86400000
  # 短信验证码登录
  sms:
    # 未接入真实短信服务商：mock 模式下发送接口回显验证码，方便本地联调；生产必须置为 false
    mock-enabled: true
    code-length: 6
    # 验证码有效期（秒）
    code-ttl-seconds: 60
    # 同一手机号两次发送的最小间隔（秒）
    send-interval-seconds: 60
    # 同一验证码最大校验失败次数，超过即作废
    max-verify-fails: 5
  # 智能客服（Spring AI Agent）
  ai:
    # 未配置真实模型 key 时为 true：使用自研 MockChatModel 降级，保证开箱可用；生产配真实 key 后置为 false
    mock-enabled: true
    # 单次对话超时（秒）
    timeout-seconds: 60
    # 装配给模型的历史消息条数上限
    history-limit: 20
    # FAQ 检索返回条数
    faq-top-k: 3
  # 对象存储（图片上传）
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:admin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:mall}
    # 对外访问前缀，为空时使用 endpoint
    public-url: ${MINIO_PUBLIC_URL:}
    # 单文件大小上限（字节），默认 5MB
    max-size-bytes: 5242880

