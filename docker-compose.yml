services:
  mysql:
    image: mysql:8.0
    container_name: mall-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: mall
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      # 时区必须与后端 JVM(Asia/Shanghai) 一致，否则 DB 生成的 CURRENT_TIMESTAMP 会比应用时间早 8 小时，
      # 导致超时关单任务把刚下单的订单误判为超时并自动取消
      TZ: Asia/Shanghai
    ports:
      - "3308:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --default-time-zone=+08:00
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mall-net

  redis:
    image: redis:7
    container_name: mall-redis
    ports:
      - "6381:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mall-net

  minio:
    image: minio/minio:latest
    container_name: mall-minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mall-net

  backend:
    build:
      context: ./backend
    container_name: mall-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mall?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: minioadmin
      SPRING_PROFILES_ACTIVE: local
    ports:
      - "8088:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - mall-net

  admin-web:
    image: nginx:alpine
    container_name: mall-admin-web
    volumes:
      - ./admin-web/dist:/usr/share/nginx/html:ro
      - ./nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3001:80"
    depends_on:
      - backend
    networks:
      - mall-net

  mobile-h5:
    image: nginx:alpine
    container_name: mall-mobile-h5
    volumes:
      - ./mobile-h5/dist:/usr/share/nginx/html:ro
      - ./nginx-mobile.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "3002:80"
    depends_on:
      - backend
    networks:
      - mall-net

volumes:
  mysql-data:
  redis-data:
  minio-data:

networks:
  mall-net:
    driver: bridge